name: CampusFlow CI

on:
  push:
    paths:
      - 'campusflow/**'
      - 'render.yaml'
      - '.github/workflows/campusflow-ci.yml'
  pull_request:
    paths:
      - 'campusflow/**'
      - 'render.yaml'
      - '.github/workflows/campusflow-ci.yml'

permissions:
  contents: read

jobs:
  backend:
    name: FastAPI tests
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: campusflow/backend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: 'pip'
          cache-dependency-path: campusflow/backend/requirements-dev.txt
      - name: Install requirements
        run: python -m pip install -r requirements-dev.txt
      - name: Run tests
        run: python -m pytest -q

  frontend:
    name: React production build
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: campusflow/frontend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Install frontend dependencies
        run: npm install --no-audit --no-fund
      - name: Build React
        run: npm run build
